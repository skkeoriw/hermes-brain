# Custom Providers Configuration Template

Use this as a starting point when configuring multiple providers (especially multi-format proxies).

```yaml
custom_providers:

# ========== OPENAI-COMPATIBLE ==========
- name: CustomOpenAI-Default
  base_url: https://api.your-proxy.com/v1
  api_key: sk-your-key-here
  model: gpt-4-turbo

- name: CustomOpenAI-Mini
  base_url: https://api.your-proxy.com/v1
  api_key: sk-your-key-here
  model: gpt-4-mini

# ========== CLAUDE-COMPATIBLE ==========
- name: CustomClaude-Sonnet
  base_url: https://api.your-proxy.com/v1
  api_key: sk-your-key-here
  model: claude-3-sonnet-20240229

- name: CustomClaude-Opus
  base_url: https://api.your-proxy.com/v1
  api_key: sk-your-key-here
  model: claude-3-opus-20240229

# ========== GEMINI-COMPATIBLE ==========
# Note: base_url is different (v1beta/models)
- name: CustomGemini-Flash
  base_url: https://api.your-proxy.com/v1beta/models
  api_key: sk-your-key-here
  model: gemini-2.5-flash

- name: CustomGemini-Pro
  base_url: https://api.your-proxy.com/v1beta/models
  api_key: sk-your-key-here
  model: gemini-3.1-pro-preview
```

## Notes

- **Naming convention:** `<Provider>-<Variant>` for clarity
- **One provider per model** to avoid confusion in webhooks/cron jobs
- **Verify each with curl first** before adding to config.yaml
- **Use for fallback in webhooks/cron** when primary provider hits quota limits
