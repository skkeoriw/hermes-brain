name: brain-doctor

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repo structure and sync helper
        run: |
          test -f scripts/hermes_brain_sync.py
          test -f scripts/bootstrap_new_machine.sh
          test -d brain/hermes-home
          python3 scripts/hermes_brain_sync.py doctor || true
